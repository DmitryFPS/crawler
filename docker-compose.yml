services:
  postgres:
    image: postgres:15
    container_name: crawler-postgres
    environment:
      POSTGRES_DB: crawler
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7
    container_name: crawler-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: crawler-app
    depends_on:
      postgres:
        condition: service_healthy  # Ждать, пока БД не станет доступна
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/crawler
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      CRAWLER_REDIS_HOST: redis
      CRAWLER_REDIS_PORT: 6379
      SPRING_LIQUIBASE_ENABLED: "false"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus,metrics"
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "always"

  prometheus:
    image: prom/prometheus
    container_name: crawler-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana
    container_name: crawler-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana  # ← Сохранение данных между перезапусками
    depends_on:
      - prometheus

volumes:
  postgres_data:
  grafana_data:
