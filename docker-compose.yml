services:
  postgres:
    image: postgres:15
    container_name: crawler-postgres
    environment:
      POSTGRES_DB: crawler
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: crawler-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  selenium:
    image: selenium/standalone-chrome:latest
    container_name: crawler-selenium
    shm_size: 4gb  # Важно для Chrome
    environment:
      - SE_NODE_MAX_SESSIONS=3  # Макс. параллельных сессий
      - SE_SCREEN_WIDTH=1920
      - SE_SCREEN_HEIGHT=1080
    ports:
      - "4444:4444"  # WebDriver hub
      - "7900:7900"  # VNC для отладки (опционально)
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4444/wd/hub/status" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 3G  # Выделить память

  app:
    build: .
    container_name: crawler-app
    depends_on:
      postgres:
        condition: service_healthy  # Ждать, пока БД не станет доступна
      redis:
        condition: service_healthy
      selenium: # Ждём Selenium
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/crawler
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      CRAWLER_REDIS_HOST: redis
      CRAWLER_REDIS_PORT: 6379
      SELENIUM_HUB_URL: http://selenium:4444/wd/hub
      SPRING_LIQUIBASE_ENABLED: "true"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus,metrics"
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "always"
    deploy:
      resources:
        limits:
          memory: 1G  # App теперь легче, Chrome вынесен

  prometheus:
    image: prom/prometheus
    container_name: crawler-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana
    container_name: crawler-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana  # ← Сохранение данных между перезапусками
    depends_on:
      - prometheus

volumes:
  postgres_data:
  grafana_data:
