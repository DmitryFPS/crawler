# docker-compose.dev.yml
# Инфраструктура для локальной разработки (без приложения)

services:
  postgres:
    image: postgres:15
    container_name: crawler-postgres
    environment:
      POSTGRES_DB: crawler
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"  # ← Важно: проброс на localhost
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: crawler-redis
    ports:
      - "6379:6379"  # ← Проброс на localhost
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  selenium:
    image: selenium/standalone-chrome:latest
    container_name: crawler-selenium
    shm_size: 4gb
    environment:
      - SE_NODE_MAX_SESSIONS=3
      - SE_SCREEN_WIDTH=1920
      - SE_SCREEN_HEIGHT=1080
    ports:
      - "4444:4444"  # ← WebDriver
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4444/wd/hub/status" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 3G

  prometheus:
    image: prom/prometheus
    container_name: crawler-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    # depends_on:
    #   - app  # ← Закомментировать, app запускается локально

  grafana:
    image: grafana/grafana
    container_name: crawler-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    # depends_on:
    #   - prometheus

volumes:
  postgres_data:
  grafana_data:
