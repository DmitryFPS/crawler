server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/crawler
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
  liquibase:
    enabled: false
    change-log: classpath:db/changelog/db.changelog-master.xml
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

crawler:
  anti-bot:
    random-delay:
      min: 1000
      max: 4000
    user-agent-rotation: true
    fingerprint-randomization: true
  redis:
    host: localhost
    port: 6379
    timeout: 5000
  selenium:
    hub:
      url: ${SELENIUM_HUB_URL:http://localhost:4444/wd/hub}
    chrome:
      options: "--window-size=1920,1080 --headless=new --disable-gpu --no-sandbox"
    proxy:
      enabled: false
      list: ""
  # КРИТИЧЕСКИ ВАЖНЫЕ настройки фильтрации
  filter:
    urls-by-keywords: false
    allow-cross-domain: false          # ← ЗАПРЕТ перехода на другие домены!
    min-content-length: 200
    allowed-domains: [ ]                # ← пусто = только стартовый домен
    blocked-domains: [ ]                # ← можно добавить: [google.com, facebook.com]
  # Настройки повторных попыток
  retry:
    max-attempts: 2                    # ← меньше = быстрее падает при ошибках
    sleep: 1000                        # ← 1 сек вместо 3
    exponential: false                 # ← линейная задержка предсказуемее
  # ⚡ Реальный rate-limit (требует реализации в коде, пока — документация)
  rate-limit:
    enabled: true
    requests-per-minute: 60            # ← 1 запрос в секунду — безопасно
  # Потоки и лимиты
  threads: 3                           # ← Должно совпадать с SE_NODE_MAX_SESSIONS!
  timeout: 30000                       # ← 30 сек на загрузку страницы
  sleep: 500                           # ← Базовая задержка между запросами
  max-depth: 3                         # ← уровни глубины
  max-pages-per-job: 2000              # ← лимит на количество обработанных страниц за один запуск краулера

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

# Логирование
logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.seleniumhq.selenium: WARN
    org.example: DEBUG
    org.example.processor: DEBUG
    org.example.downloader: DEBUG
    org.example.pipeline: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
